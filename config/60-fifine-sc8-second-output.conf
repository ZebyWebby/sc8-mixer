# Expose the Fifine SC8's second playback channel (hw:Chat,1) as its own sink
context.objects = [
  { factory = adapter
    args = {
      factory.name           = api.alsa.pcm.sink
      node.name              = "fifine_sc8_output_2"
      node.description       = "Fifine SC8 Chat"
      media.class            = "Audio/Sink"
      api.alsa.path          = "hw:Chat,1"
      audio.channels         = 2
      audio.position         = [ FL FR ]
      audio.rate             = 48000
      node.pause-on-idle     = false
    }
  }
]
